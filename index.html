<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Paste an image, drag over an area, and copy the softened result."
    />
    <title>Censor Quick</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div class="app-shell">
      <header class="titlebar" aria-label="Window controls">
        <div class="titlebar-drag-region" id="titlebar-drag-region"></div>
        <div class="window-controls">
          <button class="window-control" id="minimize-window" type="button" aria-label="Minimize" title="Minimize">
            <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 5h6" /></svg>
          </button>
          <button class="window-control" id="maximize-window" type="button" aria-label="Maximize" title="Maximize" data-maximized="false">
            <svg class="maximize-icon" viewBox="0 0 10 10" aria-hidden="true"><rect x="2" y="2" width="6" height="6" /></svg>
            <svg class="restore-icon" viewBox="0 0 10 10" aria-hidden="true" hidden><path d="M3 2h5v5M2 4v4h5" /></svg>
          </button>
          <button class="window-control close-control" id="close-window" type="button" aria-label="Close" title="Close">
            <svg viewBox="0 0 10 10" aria-hidden="true"><path d="m2.5 2.5 5 5m0-5-5 5" /></svg>
          </button>
        </div>
      </header>

      <main class="stage" id="stage" aria-label="Paste, drop, or open an image">
        <div class="empty-state" id="empty-state">
          <p>
            Paste image here, drag and drop or
            <a href="#open-image" id="open-image">open image</a>
          </p>
        </div>

        <div class="canvas-wrap" id="canvas-wrap" hidden>
          <canvas
            id="image-canvas"
            tabindex="0"
            role="img"
            aria-label="Loaded image. Drag over an area to blur it."
          ></canvas>
        </div>
        <div class="selection-frame" id="selection-frame" hidden aria-hidden="true"></div>
        <input
          id="image-file"
          type="file"
          accept="image/png,image/jpeg,image/webp"
          hidden
        />
        <div id="status-text" class="sr-only" role="status" aria-live="polite"></div>
      </main>
    </div>
  </body>
</html>
