<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111411" />
    <meta
      name="description"
      content="A small desktop tool for removing private details from screenshots."
    />
    <title>Censor Quick</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="Censor Quick">
          <span class="brand-mark" aria-hidden="true">
            <svg width="19" height="19" viewBox="0 0 20 20" fill="none">
              <path d="M3 3h5v5H3zM12 3h5v5h-5zM3 12h5v5H3z" fill="currentColor" />
              <path d="M12 12h2v2h-2zM15 15h2v2h-2zM15 12h2v2h-2zM12 15h2v2h-2z" fill="currentColor" opacity=".58" />
            </svg>
          </span>
          <span class="brand-name">censor<span>quick</span></span>
        </a>

        <div class="top-actions">
          <button class="button" id="open-image" type="button" title="Open an image (Ctrl+O)">
            <svg width="15" height="15" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            </svg>
            <span>Open image</span>
          </button>
          <button class="button button-primary" id="copy-image" type="button" title="Copy edited image (Ctrl+C)">
            <svg width="15" height="15" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <rect x="7" y="6" width="9" height="11" rx="1.5" stroke="currentColor" stroke-width="1.5" />
              <path d="M13 6V4.5A1.5 1.5 0 0 0 11.5 3h-7A1.5 1.5 0 0 0 3 4.5v9A1.5 1.5 0 0 0 4.5 15H7" stroke="currentColor" stroke-width="1.5" />
            </svg>
            <span>Copy image</span>
            <kbd>Ctrl C</kbd>
          </button>
        </div>
        <input id="image-file" type="file" accept="image/png,image/jpeg,image/webp" hidden />
      </header>

      <main>
        <section class="toolbar" aria-label="Pixelation settings">
          <div class="tool-heading">
            <span class="tool-icon" aria-hidden="true">
              <svg width="17" height="17" viewBox="0 0 20 20" fill="none">
                <circle cx="8" cy="8" r="5" stroke="currentColor" stroke-width="1.4" />
                <path d="m11.8 11.8 4.7 4.7M8 5v6M5 8h6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
              </svg>
            </span>
            <span>
              <span class="tool-name">Pixelate</span>
              <span class="tool-description">Drag over details to replace them</span>
            </span>
          </div>

          <label class="pixel-control" for="pixel-size">
            <span class="slider-caption">
              <span>Pixel size</span>
              <output id="pixel-output" for="pixel-size">18 px</output>
            </span>
            <input id="pixel-size" type="range" min="8" max="40" step="1" value="18" />
            <span class="slider-scale" aria-hidden="true">
              <span>Fine</span>
              <span>Chunky</span>
            </span>
          </label>

          <span class="privacy-note">
            <svg width="14" height="14" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <rect x="4" y="8" width="12" height="9" rx="2" stroke="currentColor" stroke-width="1.4" />
              <path d="M7 8V5.8a3 3 0 0 1 6 0V8" stroke="currentColor" stroke-width="1.4" />
              <circle cx="10" cy="12.5" r="1" fill="currentColor" />
            </svg>
            Generated noise replaces the source pixels
          </span>
        </section>

        <section class="stage" id="stage" aria-label="Image editing area">
          <div class="empty-state" id="empty-state">
            <div class="pixel-sample" aria-hidden="true">
              <span></span><span></span><span></span><span></span>
              <span></span><span></span><span></span><span></span>
              <span></span><span></span><span></span><span></span>
              <span></span><span></span><span></span><span></span>
            </div>
            <h1>Paste an image to begin</h1>
            <p class="empty-copy">
              Copy a screenshot, then press <kbd>Ctrl</kbd> + <kbd>V</kbd>,
              or <button class="text-button" id="empty-open" type="button">open an image</button>.
            </p>
            <p class="empty-footnote">Images stay on this device</p>
          </div>

          <div class="canvas-wrap" id="canvas-wrap" hidden>
            <canvas
              id="image-canvas"
              tabindex="0"
              role="img"
              aria-label="Loaded image. Drag over an area to replace it with random pixels."
            ></canvas>
          </div>
          <div class="selection-frame" id="selection-frame" hidden aria-hidden="true"></div>
        </section>

        <footer class="workspace-footer">
          <div class="status" id="status" data-state="ready" aria-live="polite">
            <span class="status-led" aria-hidden="true"></span>
            <span id="status-text">Paste an image to begin.</span>
            <span class="image-info" id="image-info" hidden></span>
          </div>
          <div class="shortcut-hints" aria-label="Keyboard shortcuts">
            <span><kbd>Ctrl</kbd><kbd>V</kbd> Paste</span>
            <span><kbd>Ctrl</kbd><kbd>C</kbd> Copy</span>
            <span>Drag to pixelate</span>
          </div>
        </footer>
      </main>
    </div>
  </body>
</html>
